[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interopera-auditable-reporting"
version = "1.0.0"
description = "Deterministic, graph-traceable portfolio compliance reporting"
requires-python = ">=3.11"
dependencies = ["pypdf==6.10.0"]

[tool.setuptools.packages.find]
where = ["src"]
